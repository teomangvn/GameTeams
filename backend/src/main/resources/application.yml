spring:
  application:
    name: gameteams

  # Kök dizindeki .env'i properties olarak okur. Docker'da değişkenler ortamdan
  # geldiği için dosya bulunmaz; "optional:" bu durumda hata vermez.
  config:
    import: optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gameteams}
    username: ${DB_USER:gameteams}
    password: ${DB_PASSWORD:gameteams}

  jpa:
    # Şemayı Flyway yönetir; Hibernate sadece doğrular.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}

  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

gameteams:
  # Doğrulama/şifre sıfırlama maillerindeki linkler bu adrese işaret eder.
  app-url: ${APP_URL:http://localhost:5173}
  mail-from: ${MAIL_FROM:no-reply@gameteams.local}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TTL:P30D}
  # Dev kolaylığı için açılışta seed edilen admin. Değerler .env'den gelir;
  # ADMIN_PASSWORD boşsa seeder hiçbir şey yapmaz.
  admin:
    username: ${ADMIN_USERNAME:admin}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
