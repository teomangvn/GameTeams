spring:
  application:
    name: gameteams

  # Kök dizindeki .env'i properties olarak okur. Docker'da değişkenler ortamdan
  # geldiği için dosya bulunmaz; "optional:" bu durumda hata vermez.
  config:
    import: optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gameteams}
    username: ${DB_USER:gameteams}
    password: ${DB_PASSWORD:gameteams}

  jpa:
    # Şemayı Flyway yönetir; Hibernate sadece doğrular.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}

  servlet:
    multipart:
      # AvatarStorage da ayrica sinirliyor; bu katman istegi daha govde
      # diske yazilmadan reddeder.
      max-file-size: 8MB
      max-request-size: 10MB

  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      group:
        # Deploy ve konteyner saglik kontrolu bunu kullanir. Mail bilerek
        # disarida: SMTP gecici erisilemez oldugunda uygulama trafigi
        # karsilamaya devam eder, deploy bosuna basarisiz sayilmamalidir.
        # Mail durumu /actuator/health uzerinden hala gorulebilir.
        readiness:
          include: db, redis, ping

gameteams:
  # Doğrulama/şifre sıfırlama maillerindeki linkler bu adrese işaret eder.
  app-url: ${APP_URL:http://localhost:5173}
  mail-from: ${MAIL_FROM:no-reply@gameteams.local}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TTL:P30D}
  # Dev kolaylığı için açılışta seed edilen admin. Değerler .env'den gelir;
  # ADMIN_PASSWORD boşsa seeder hiçbir şey yapmaz.
  admin:
    username: ${ADMIN_USERNAME:admin}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  security:
    # Taninmayan cihazdan giriste e-postaya kod gonderilir.
    # KURTARMA: e-posta gitmiyorsa false yapip backend'i yeniden baslat,
    # aksi halde kimse giris yapamaz.
    device-verification: ${DEVICE_VERIFICATION:true}
    challenge-ttl: ${DEVICE_CHALLENGE_TTL:PT10M}
    trust-ttl: ${DEVICE_TRUST_TTL:P90D}
  uploads:
    # Tek EC2 uzerinde calisiyoruz; nesne deposu yerine docker volume.
    avatar-dir: ${AVATAR_DIR:./uploads/avatars}
    max-avatar-bytes: ${MAX_AVATAR_BYTES:2097152}
    attachment-dir: ${ATTACHMENT_DIR:./uploads/attachments}
    max-attachment-bytes: ${MAX_ATTACHMENT_BYTES:8388608}
  cookie:
    # Prod'da nginx TLS sonlandirdigi icin true olmali (application-prod.yml).
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
  webrtc:
    # Google STUN ucretsiz ve dev icin yeterli. Prod'da coturn eklenir.
    stun-urls: ${STUN_URLS:stun:stun.l.google.com:19302}
    turn-urls: ${TURN_URLS:}
    # coturn "use-auth-secret" modu icin paylasilan sir. Bos ise TURN kapali.
    turn-secret: ${TURN_SECRET:}
    turn-credential-ttl: ${TURN_TTL:PT12H}
