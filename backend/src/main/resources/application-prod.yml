# Prod profili: AWS SES SMTP. Tüm sırlar sunucudaki .env'den gelir.
spring:
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

  jpa:
    show-sql: false

management:
  endpoint:
    health:
      show-details: never

gameteams:
  cookie:
    # Prod'da her sey HTTPS uzerinden; cookie duz HTTP'de gonderilmemeli.
    secure: true
    same-site: Lax

logging:
  level:
    root: INFO
    com.gameteams: INFO
