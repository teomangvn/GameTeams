# Prod stack. Sirlar sunucudaki .env'den gelir, repoda tutulmaz.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  postgres:
    ports: []          # Disariya acilmaz; yalnizca ic ag.
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

  redis:
    ports: []

  # Mailpit prod'da calismaz; mailler AWS SES uzerinden gider.
  mailpit:
    profiles: ["dev-only"]

  backend:
    # CI imaji GHCR'a iter, sunucu ceker. build: elle deploy icin duruyor;
    # "docker compose build" ayni etiketi uretir.
    image: ${BACKEND_IMAGE:-gameteams-backend:local}
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Konteynerde ../.env okunamaz (WORKDIR=/app); butun yapilandirma
      # ortam degiskenleriyle gecilmeli. Eksik birakilan degisken sessizce
      # application.yml varsayilanina duser -- veritabani sifresi icin bu
      # baglanti hatasi demektir.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_URL: ${APP_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-PT15M}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-P30D}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      # Bu ikisi .env'de olsa bile burada listelenmezse konteynere ulasmaz ve
      # application.yml varsayilani olan false gecerli olur. SES 587'de STARTTLS
      # zorunlu; kapali kalirsa kimlik bilgileri duz metin gitme riski tasir.
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      AVATAR_DIR: /app/uploads/avatars
      # Taninmayan cihazdan giriste e-postaya kod gonderir.
      # KURTARMA: mail gitmiyorsa .env'de false yapip backend'i yeniden baslat,
      # aksi halde kimse giris yapamaz.
      DEVICE_VERIFICATION: ${DEVICE_VERIFICATION:-true}
      STUN_URLS: ${STUN_URLS}
      TURN_URLS: ${TURN_URLS}
      TURN_SECRET: ${TURN_SECRET}
      TURN_TTL: ${TURN_TTL:-PT12H}
      # ADMIN_PASSWORD bilerek gecilmiyor: tanimsiz oldugunda AdminUserSeeder
      # calismaz. Prod'da admin hesabi seed edilmemeli; hesap kayit akisiyla
      # olusturulup veritabanindan role='ADMIN' yapilir.
    volumes:
      # Avatarlar konteyner disinda yasamali; imaj her deploy'da degisiyor.
      - avatar-data:/app/uploads/avatars
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-gameteams-frontend:local}
    build:
      context: ./frontend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      # Yalnizca DOMAIN degistirilir; $$host gibi nginx degiskenleri korunur.
      NGINX_ENVSUBST_FILTER: DOMAIN
    volumes:
      # templates/ altindakiler acilista islenip conf.d/'ye yazilir.
      - ./infra/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./infra/certbot/conf:/etc/letsencrypt:ro
      - ./infra/certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  coturn:
    image: coturn/coturn:latest
    network_mode: host      # Relay portlari icin NAT katmani istemiyoruz.
    volumes:
      - ./infra/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    # Sirlar dosyaya degil komut satirina: repoya sizmasin.
    command:
      - "-c"
      - "/etc/coturn/turnserver.conf"
      - "--static-auth-secret=${TURN_SECRET}"
      - "--realm=${DOMAIN}"
      - "--external-ip=${TURN_EXTERNAL_IP}"
    restart: unless-stopped
