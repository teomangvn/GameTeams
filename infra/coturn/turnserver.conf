# coturn — WebRTC TURN relay
#
# Kullanicilarin bir kismi symmetric NAT arkasindadir ve dogrudan P2P
# kuramaz; bu durumda ses relay uzerinden akar. TURN olmadan bu kullanicilar
# birbirini hic duyamaz, dolayisiyla opsiyonel degildir.

listening-port=3478
fingerprint

# Statik kullanici yerine paylasilan sir: sunucu, kisa omurlu kimlik bilgisi
# uretir (bkz. IceServerController). Sizan bir sifre kalici erisim vermez.
#
# static-auth-secret, realm ve external-ip docker-compose.prod.yml icinden
# komut satiri ile gecilir. Sirri bu dosyaya yazmak repoya sizmasina yol acardi.
use-auth-secret

# Relay port araligi; guvenlik grubunda da ayni aralik acilmalidir.
min-port=49160
max-port=49200

# EC2 gibi NAT arkasi sunucularda ikisi de gerekir: birincisi ozel,
# ikincisi elastic IP (external-ip komut satirindan gelir).
listening-ip=0.0.0.0

# TURN sunucusunun ic aga veya loopback'e proxy olarak kullanilmasini engelle.
no-loopback-peers
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=169.254.0.0-169.254.255.255

# CPU yakan ozellikler kapali; yalnizca TURN/STUN gerekiyor.
no-cli
no-tlsv1
no-tlsv1_1
