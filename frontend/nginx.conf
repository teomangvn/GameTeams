server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hash'li dosya adlari sayesinde uzun onbellek guvenli.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: bilinmeyen yollar index.html'e duser, yonlendirmeyi React Router yapar.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
